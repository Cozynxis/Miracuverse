name: Sync character and kwami portraits
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: write
concurrency:
  group: character-portraits
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover portraits via MediaWiki API
        run: python scripts/sync_character_images.py
      - name: Commit character image data only
        run: |
          if ! git diff --quiet -- api/characters.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/characters.json
            git commit -m "Auto-sync Miraculous character and kwami images"
            git push
          fi
