name: Sync Miraculous end cards
on:
  workflow_dispatch:
  schedule:
    - cron: "21 5 * * 0"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: pip install requests beautifulsoup4
      - name: Scan wiki end-card galleries
        run: python scripts/sync_endcards.py
      - name: Commit image URL index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add endcards.json
          git diff --cached --quiet || (git commit -m "Update Miraculous end-card image index" && git push)
